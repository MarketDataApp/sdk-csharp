name: CI

on:
  push:
    branches: [ main ]
  # Deliberately no branches filter: on pull_request the filter matches the PR's BASE
  # branch, which silently skipped CI for stacked PRs (a PR opened against another
  # feature branch got zero checks — see #45). Every PR runs the full suite regardless
  # of its base; push stays main-only, so each PR still gets exactly one run per head
  # update and the concurrency group below cancels superseded ones.
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: Run live integration tests (requires MARKETDATA_TOKEN secret)
        type: boolean
        default: false

# Least privilege by default: the CI jobs only need to read the repo. Any job
# that needs more should elevate its own `permissions:` block rather than the
# whole workflow being granted write scopes.
permissions:
  contents: read

# Cancel superseded runs on the same pull request, but never cancel main /
# release runs (each merge should produce a full result and coverage baseline).
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Picks the OS matrix based on the triggering event: pull requests run
  # ubuntu-only to keep per-PR cost low, while push-to-main, releases, and
  # manual dispatch exercise the full cross-OS matrix (§13 forward-compat).
  # The unit/build OS matrix is the ONLY thing trimmed on PRs; the coverage
  # gate and the integration job are unaffected.
  setup:
    name: Select OS matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os: ${{ steps.matrix.outputs.os }}
    steps:
      - name: Choose OS list by event
        id: matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build / Test / Pack (${{ matrix.os }})
    needs: setup
    runs-on: ${{ matrix.os }}
    # A full leg (restore + build + two test runs) finishes well inside this on every
    # runner. The cap exists so a hung restore or a deadlocked test cannot hold a runner
    # for the 6-hour GitHub default.
    timeout-minutes: 30
    strategy:
      # Run every OS to completion even if one fails, so a single-platform
      # failure still yields results for the others.
      fail-fast: false
      matrix:
        # Dynamic per §7: ubuntu-only on PRs, full matrix otherwise. The library
        # multi-targets net8.0 and net10.0 (both LTS), and every leg runs the unit
        # suite on BOTH runtimes (§13 multiple runtime versions), so the matrix
        # only needs to vary the OS.
        os: ${{ fromJSON(needs.setup.outputs.os) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history required for Source Link and MinVer

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # SDK pinned to the repo's band (see global.json: 10.0.x); the 8.0.x entry
          # additionally provides the .NET 8 runtime that the net8.0 test leg runs on.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore MarketDataApp.slnx

      # Supply-chain gate, mirroring the PHP SDK's `composer audit` step. Runs on the
      # ubuntu leg only: the advisory database is platform-independent, so checking it
      # three times per run would only repeat the same answer.
      #
      # `dotnet list package --vulnerable` reports findings on stdout and STILL exits 0,
      # so grepping the exit code silently passes a vulnerable build. The JSON form is
      # parsed instead. A project with no advisories has no "frameworks" key at all
      # (not an empty array), so every lookup below is null-safe via `[]?` and `// []`.
      - name: Audit dependencies for known vulnerabilities
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive --format json > vulnerable.json
          count=$(jq '[.projects[]? | .frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[]] | length' vulnerable.json)
          if [ "$count" -gt 0 ]; then
            echo "::error::${count} vulnerable package reference(s) in the restored dependency graph."
            dotnet list package --vulnerable --include-transitive
            exit 1
          fi
          echo "No known vulnerabilities in the restored dependency graph."

      # Advisory only — deprecation is a maintenance signal, not a security finding.
      # xunit 2.x is currently flagged "Legacy" in favour of xunit.v3, a migration this
      # repo has not made, so failing on this would wedge every build today.
      - name: Report deprecated dependencies (advisory)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: dotnet list package --deprecated --include-transitive

      # Source Link and ContinuousIntegrationBuild switch on automatically in CI:
      # MarketDataApp.csproj gates them on GITHUB_ACTIONS, which is always set here.
      - name: Build
        run: dotnet build MarketDataApp.slnx --no-restore -c Release

      # coverlet.msbuild enforces the coverage gate: Threshold=100 on TOTAL line AND
      # branch coverage fails this step and thus the job (§13/§15). We use the msbuild
      # integration rather than the collector because coverlet.collector silently
      # ignores the runsettings <Threshold> and cannot gate. The comma in
      # ThresholdType is written as %2c so the value parses identically under bash,
      # pwsh and cmd across the OS matrix. The same run emits the opencover report.
      # Coverage is at 100% line and 100% branch, so this gate passes; it fails the
      # job if coverage regresses below 100%. The gate runs on EVERY matrix leg and
      # therefore on every event (PR, push, release, dispatch) per §7.
      #
      # One explicit invocation per target framework: letting a single `dotnet test`
      # fan out over both TFMs runs the legs in parallel with interleaved output and
      # racy coverage-report writes; -f per leg keeps runs deterministic, gates each
      # runtime independently, and gives each report a stable file name.
      - name: Test on .NET 8 with coverage (100% line+branch gate)
        # Force bash on every runner (incl. Windows via Git Bash) so the multi-line
        # command and backslash continuations parse consistently across the matrix.
        #
        # CoverletOutput is a PREFIX, not a file name: because the test project
        # multi-targets, coverlet always appends ".{tfm}.{format}.xml" to it, so this
        # writes TestResults/coverage.net8.0.opencover.xml. Spelling the full file name
        # here instead produced coverage.net8.0.opencover.net8.0.xml, which neither the
        # coverage artifact glob nor the Codecov files list matched (#49).
        shell: bash
        run: |
          dotnet test src/MarketDataApp.Tests/MarketDataApp.Tests.csproj \
            --no-build -c Release -f net8.0 \
            -p:CollectCoverage=true \
            -p:CoverletOutputFormat=opencover \
            -p:CoverletOutput=TestResults/coverage \
            -p:Threshold=100 \
            -p:ThresholdType=line%2cbranch \
            -p:ThresholdStat=total \
            --results-directory TestResults \
            --logger "trx;LogFileName=test-results-net8.0.trx"

      - name: Test on .NET 10 with coverage (100% line+branch gate)
        shell: bash
        run: |
          dotnet test src/MarketDataApp.Tests/MarketDataApp.Tests.csproj \
            --no-build -c Release -f net10.0 \
            -p:CollectCoverage=true \
            -p:CoverletOutputFormat=opencover \
            -p:CoverletOutput=TestResults/coverage \
            -p:Threshold=100 \
            -p:ThresholdType=line%2cbranch \
            -p:ThresholdStat=total \
            --results-directory TestResults \
            --logger "trx;LogFileName=test-results-net10.0.trx"

      # Publish coverage to Codecov from the ubuntu leg only (one canonical
      # upload). Works tokenless for public repos; CODECOV_TOKEN is only needed
      # for private repos or to avoid rate limits, and is optional here.
      # fail_ci_if_error is false so a Codecov outage never fails the build.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          # coverlet.msbuild writes CoverletOutput relative to the test project dir.
          files: src/MarketDataApp.Tests/TestResults/coverage.net8.0.opencover.xml,src/MarketDataApp.Tests/TestResults/coverage.net10.0.opencover.xml
          slug: MarketDataApp/sdk-csharp
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format MarketDataApp.slnx --verify-no-changes --no-restore

      # Context7 silently drops a config that fails its schema, so an over-long rule costs a
      # whole indexing cycle with no error surfaced here. Shared with the other SDK repos —
      # see MarketDataApp/actions for the constraints and why they are transcribed rather
      # than fetched.
      - name: Validate context7.json
        if: matrix.os == 'ubuntu-latest'
        uses: MarketDataApp/actions/validate-context7@v1

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/MarketDataApp/MarketDataApp.csproj \
            -c Release --no-build \
            -o artifacts/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/

      # Uploaded even when the coverage gate fails, so the report is always produced.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          # coverlet.msbuild writes CoverletOutput relative to the test project dir.
          path: src/MarketDataApp.Tests/TestResults/coverage.*.opencover.xml
          if-no-files-found: warn

      - name: Upload NuGet packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-ci
          path: artifacts/

  integration:
    name: Integration Tests (live)
    # Runs on pull requests and on published releases, plus manual dispatch with the
    # checkbox enabled — never on ordinary pushes/commits to a branch. Per §13 the
    # integration suite MUST keep running on PRs, so it is deliberately independent
    # of the trimmed unit/build OS matrix above. The IntegrationFactAttribute guard
    # inside the tests also skips individual tests when MARKETDATA_TOKEN or
    # MARKETDATA_RUN_INTEGRATION_TESTS is absent (e.g. fork PRs that cannot see
    # repository secrets).
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration_tests == 'true')
    runs-on: ubuntu-latest
    # Every step here talks to the live API. Without a cap, one hung request would hold
    # the runner until the 6-hour default expires.
    timeout-minutes: 20
    env:
      MARKETDATA_RUN_INTEGRATION_TESTS: "true"
      MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
      # The C# docs pages live on staging until the docs site's staging -> main promotion;
      # DocsLivenessTests rewrites the canonical hosts to this value. Remove after promotion.
      MARKETDATA_DOCS_HOST: www-staging.marketdata.app

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history required for Source Link and MinVer

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MarketDataApp.slnx

      - name: Build
        run: dotnet build MarketDataApp.slnx --no-restore -c Release

      - name: Run integration tests
        run: |
          dotnet test src/MarketDataApp.IntegrationTests/MarketDataApp.IntegrationTests.csproj \
            --no-build -c Release \
            --results-directory TestResults \
            --logger "trx;LogFileName=integration-results.trx"

      # Smoke-run the example mini-apps end to end (#58, maintainer-approved): one live
      # pass each proves the full user experience — one-line client setup, startup token
      # validation, a data request, and rendering/export — still works, which no unit test
      # reproduces. A non-zero exit code fails the job. Cost: ~3 live requests plus one
      # small chain. Skipped when the token secret is absent (fork PRs), mirroring the
      # IntegrationFactAttribute guard above.
      - name: Smoke-run Watchlist (--once)
        if: env.MARKETDATA_TOKEN != ''
        run: dotnet run --project examples/Watchlist -c Release --no-build -- AAPL MSFT --once

      - name: Smoke-run Watchlist CSV export
        if: env.MARKETDATA_TOKEN != ''
        run: dotnet run --project examples/Watchlist -c Release --no-build -- --export AAPL TestResults/aapl-daily.csv

      - name: Smoke-run OptionsChainMonitor (--once)
        if: env.MARKETDATA_TOKEN != ''
        run: dotnet run --project examples/OptionsChainMonitor -c Release --no-build -- AAPL --dte 30 --strikes 2 --once

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: TestResults/
