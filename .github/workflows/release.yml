name: Release

# Triggers (UNCHANGED — nothing publishes until a version tag is pushed):
#  - Push of a semver tag  (e.g. git tag v0.2.0 && git push origin v0.2.0)
#  - Manual dispatch with an optional version override
#
# Publishing model: OIDC Trusted Publishing to NuGet.org.
#  (a) ONE-TIME SETUP: a Trusted Publisher policy for this repository +
#      workflow must be registered on NuGet.org (Account > Trusted Publishing)
#      and linked to the package/owner before the first publish. Until that
#      policy exists, the `NuGet/login` step below cannot mint a key.
#  (b) NO long-lived NUGET_API_KEY secret is required — `NuGet/login@v1`
#      exchanges the workflow's short-lived OIDC token for a temporary API key
#      that is valid for only this run.
#  (c) Provenance for every produced *.nupkg / *.snupkg is attested via
#      actions/attest-build-provenance BEFORE anything is pushed.
#
# Legacy fallback (only if OIDC / Trusted Publishing is not yet set up):
#   store a NuGet.org push API key as the `NUGET_API_KEY` repo secret, delete
#   the "NuGet login (OIDC Trusted Publishing)" step, and change the push steps'
#   --api-key to "${{ secrets.NUGET_API_KEY }}". See the commented block on the
#   push steps below.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: |
          Package version to publish (e.g. 0.2.0).
          Leave blank to let MinVer derive the version from git tags.
        required: false
        type: string
      ref:
        description: Commit SHA to build and publish from (defaults to the launch commit).
        required: false
        default: ''
        type: string
  # Chained entry point: tag-and-release.yml calls this after it cuts the tag and the
  # GitHub Release, so publishing has exactly one implementation.
  #
  # The chain is not optional plumbing. A tag or release created by a workflow using the
  # default GITHUB_TOKEN does NOT start another workflow run — GitHub suppresses it to
  # stop recursive triggering. So the `push: tags` trigger above never fires for an
  # automated release, and this workflow_call is the only path that reaches NuGet.
  workflow_call:
    inputs:
      version:
        description: Package version to publish (e.g. 0.2.0).
        required: true
        type: string
      ref:
        description: Commit SHA to build and publish from.
        required: false
        default: ''
        type: string

jobs:
  # Refuses to publish a commit whose CI is not green. Only meaningful on the
  # tag-push path: a tag pushed by hand has had no gate of its own, whereas the
  # workflow_call path has just run the full OS matrix in tag-and-release.yml's
  # `gate` job, and a workflow_dispatch is an explicit manual override.
  guard:
    name: Require green CI for this commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check latest CI conclusion for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api \
            "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed" \
            --jq '.workflow_runs[0].conclusion // "missing"')
          echo "CI conclusion for ${SHA}: ${conclusion}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI is not green for ${SHA} (got: ${conclusion}). Tag a commit on main whose CI passed, or use the Tag and Release workflow."
            exit 1
          fi

  publish:
    name: Pack and publish to NuGet.org
    needs: guard
    # `guard` is skipped on the workflow_call and workflow_dispatch paths. A skipped
    # dependency would normally skip this job too, so accept anything except an actual
    # failure or cancellation.
    if: always() && needs.guard.result != 'failure' && needs.guard.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Scopes the NuGet publish to a named environment so required reviewers, wait
    # timers, and environment-scoped secrets can gate it in repository settings.
    # GitHub creates the environment on first use; it carries NO protection rules
    # until someone configures them under Settings > Environments.
    environment:
      name: nuget
      url: https://www.nuget.org/packages/MarketDataApp
    permissions:
      id-token: write       # mint the OIDC token for NuGet Trusted Publishing + attestation
      contents: read        # checkout only
      attestations: write   # write the build-provenance attestation

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Source Link needs full history
          # Build the exact commit that was tagged when chained, so the published bytes
          # match the release. Falls back to the triggering ref (the tag on a tag push).
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Pinned to the repo's SDK band (see global.json: 10.0.x).
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MarketDataApp.slnx

      # `inputs.version` is populated on BOTH the workflow_dispatch and workflow_call
      # paths, so one lookup covers them; only the tag push has to read the ref. When
      # neither supplies a value, VER stays empty and MinVer derives the version from
      # the git tags on its own.
      - name: Determine version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VER="${INPUT_VERSION}"
          if [ -z "$VER" ] && [ "${{ github.event_name }}" = "push" ]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      # Versioning is git-tag-driven via MinVer. On a tag push MinVer derives the
      # version from the tag (MinVerTagPrefix=v). For a manual dispatch with an
      # explicit version we pass MinVerVersionOverride, which MinVer honors over the
      # computed value. ContinuousIntegrationBuild / Source Link switch on
      # automatically here (MarketDataApp.csproj gates them on GITHUB_ACTIONS).
      - name: Build
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          EXTRA=""
          if [ -n "$VER" ]; then
            EXTRA="-p:MinVerVersionOverride=${VER}"
          fi
          dotnet build MarketDataApp.slnx --no-restore -c Release ${EXTRA}

      - name: Test
        run: |
          dotnet test src/MarketDataApp.Tests/MarketDataApp.Tests.csproj \
            --no-build -c Release

      # Release gate (#56): the live integration suite must pass before anything is packed
      # or published. IntegrationFactAttribute silently SKIPS every test when the token is
      # absent — a skipped suite would void the gate while looking green — so a missing
      # secret fails the release outright instead.
      - name: Require integration credentials
        env:
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
        shell: bash
        run: |
          if [ -z "${MARKETDATA_TOKEN}" ]; then
            echo "::error::The MARKETDATA_TOKEN secret is required: releases gate on the live integration suite."
            exit 1
          fi

      - name: Integration tests (live release gate)
        env:
          MARKETDATA_RUN_INTEGRATION_TESTS: "true"
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
          # The C# docs pages live on staging until the docs site's staging -> main promotion;
          # DocsLivenessTests rewrites the canonical hosts to this value. Remove after promotion.
          MARKETDATA_DOCS_HOST: www-staging.marketdata.app
        run: |
          dotnet test src/MarketDataApp.IntegrationTests/MarketDataApp.IntegrationTests.csproj \
            --no-build -c Release \
            --results-directory TestResults \
            --logger "trx;LogFileName=release-integration-results.trx"

      # Uploaded even on failure so a blocked release keeps its evidence.
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-integration-results
          path: TestResults/

      - name: Pack
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          EXTRA=""
          if [ -n "$VER" ]; then
            EXTRA="-p:MinVerVersionOverride=${VER}"
          fi
          dotnet pack src/MarketDataApp/MarketDataApp.csproj \
            -c Release --no-build \
            ${EXTRA} \
            -o artifacts/

      # Attest build provenance for the packages BEFORE they are pushed, so the
      # signed SLSA provenance covers exactly the bytes that get published. This
      # needs id-token: write + attestations: write (declared above).
      - name: Attest build provenance for packages
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      # Exchange the job's short-lived OIDC token for a temporary NuGet.org API
      # key. Requires the one-time Trusted Publisher policy described in the
      # header. Replace the `user` value with the NuGet.org account/username that
      # owns the Trusted Publisher policy (kept in a repo variable here).
      - name: NuGet login (OIDC Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # This is the nuget.org ACCOUNT username (profile name, never an email
          # address) that created the Trusted Publishing policy: `marketdata`.
          #
          # It is NOT the package owner. The packages are owned by the MarketDataApp
          # organization, which is selected as the policy's *owner* in the nuget.org UI.
          # Account and owner are separate fields; putting the org name here fails with
          # "No matching trust policy owned by user was found".
          #
          # The repository variable wins when set, so the account can be changed without
          # editing this file.
          user: ${{ vars.NUGET_USER || 'marketdata' }}

      - name: Push .nupkg to NuGet.org
        # Legacy fallback (no OIDC): drop the NuGet/login step and use
        #   --api-key "${{ secrets.NUGET_API_KEY }}"
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push .snupkg symbols to NuGet.org
        # continue on error so a missing snupkg does not block the release.
        # Legacy fallback: --api-key "${{ secrets.NUGET_API_KEY }}"
        continue-on-error: true
        run: |
          dotnet nuget push "artifacts/*.snupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload packages as artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-${{ steps.ver.outputs.version || 'manual' }}
          path: artifacts/
